# pnpm config (pnpm 11 reads build allowances/overrides from here,
# NOT from package.json).
allowBuilds:
  esbuild: true
  unrs-resolver: true
# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - "@bitbaum/*"
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms

overrides:
  # Security floors (2026-10-30 dev-toolchain sweep): stay inside the
  # major the parents already allow; pnpm does not re-resolve these on update.
  "browserslist@4": "^4.28.7"
  "vite@8": "^8.2.4"
